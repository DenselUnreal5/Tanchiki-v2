<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Halo Glow -->
    <radialGradient id="stormGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Crest Rim Gradient (Gold & Amber) -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Titanium Crest Rim Highlight -->
    <linearGradient id="titaniumRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Crest Inner Steel Base -->
    <linearGradient id="crestSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152033"/>
      <stop offset="45%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Left Facet (Light Titanium Steel) -->
    <linearGradient id="armorLight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Right Facet (Deep Gunmetal Shadow) -->
    <linearGradient id="armorDark" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Track Armored Skirt Gradient -->
    <linearGradient id="skirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Cyan Energy Storm Core -->
    <linearGradient id="cyanCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Cyan Horizontal Visor Glow -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Solid Drop Shadow -->
    <filter id="emblemShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Subtle Cyan Bloom -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Halo -->
  <circle cx="256" cy="256" r="236" fill="url(#stormGlow)"/>

  <!-- ==================== MONOLITHIC BALLISTIC SHIELD ==================== -->
  <g filter="url(#emblemShadow)">
    <!-- Shield Outer Heavy Bevel -->
    <polygon points="256,40 444,116 444,324 256,472 68,324 68,116"
             fill="#070a12" stroke="url(#goldRim)" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Shield Titanium Chamfer Edge -->
    <polygon points="256,52 432,122 432,316 256,458 80,316 80,122"
             fill="#0d1424" stroke="url(#titaniumRim)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Shield Inner Armor Plate -->
    <polygon points="256,64 420,128 420,308 256,444 92,308 92,128"
             fill="url(#crestSteel)"/>

    <!-- Integrated Tactical Crest Angles (Clean Geometric Reinforcements) -->
    <path d="M92 128 L256 220 L420 128" fill="none" stroke="#1e293b" stroke-width="2.5" opacity="0.6"/>
    <path d="M256 64 L256 444" fill="none" stroke="#1e293b" stroke-width="2" opacity="0.45"/>
    <path d="M92 308 L256 360 L420 308" fill="none" stroke="#1e293b" stroke-width="2.5" opacity="0.6"/>

    <!-- Corner Gold Rivets -->
    <circle cx="256" cy="56" r="3.5" fill="#f59e0b"/>
    <circle cx="426" cy="124" r="3.5" fill="#f59e0b"/>
    <circle cx="426" cy="312" r="3.5" fill="#f59e0b"/>
    <circle cx="256" cy="450" r="3.5" fill="#f59e0b"/>
    <circle cx="86" cy="312" r="3.5" fill="#f59e0b"/>
    <circle cx="86" cy="124" r="3.5" fill="#f59e0b"/>
  </g>

  <!-- ==================== SOLID MONOLITHIC HEAVY TANK ==================== -->
  <g id="heavy_tank" transform="translate(0, 4)">

    <!-- --- 1. SOLID TRACK SPONSONS & ARMOR SKIRTS --- -->
    <!-- Left Track Sponson (Solid Chiseled Form) -->
    <polygon points="106,196 156,176 156,380 106,356"
             fill="#0a0f1d" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="110,202 152,184 152,374 110,352"
             fill="url(#trackMetal)"/>
    <!-- Heavy-Duty Track Cleats (Continuous Integrated Structure) -->
    <path d="M110 216 L152 198 M110 236 L152 218 M110 256 L152 238 M110 276 L152 258 M110 296 L152 278 M110 316 L152 298 M110 336 L152 318 M110 354 L152 336"
          stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <!-- Left Armored Track Guard Plate -->
    <polygon points="102,192 144,174 148,368 106,348"
             fill="url(#skirtGrad)" stroke="#1e293b" stroke-width="2" opacity="0.9"/>
    <line x1="126" y1="190" x2="128" y2="354" stroke="#94a3b8" stroke-width="1.5" opacity="0.4"/>

    <!-- Right Track Sponson (Solid Chiseled Form) -->
    <polygon points="406,196 356,176 356,380 406,356"
             fill="#0a0f1d" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="402,202 360,184 360,374 402,352"
             fill="url(#trackMetal)"/>
    <!-- Heavy-Duty Track Cleats -->
    <path d="M402 216 L360 198 M402 236 L360 218 M402 256 L360 238 M402 276 L360 258 M402 296 L360 278 M402 316 L360 298 M402 336 L360 318 M402 354 L360 336"
          stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <!-- Right Armored Track Guard Plate -->
    <polygon points="410,192 368,174 364,368 406,348"
             fill="url(#skirtGrad)" stroke="#1e293b" stroke-width="2" opacity="0.9"/>
    <line x1="386" y1="190" x2="384" y2="354" stroke="#64748b" stroke-width="1.5" opacity="0.3"/>

    <!-- --- 2. MONOLITHIC CHISELED HULL GLACIS --- -->
    <!-- Lower Glacis Shadow Support -->
    <polygon points="152,374 360,374 340,404 172,404"
             fill="#060911" stroke="#1e293b" stroke-width="2"/>

    <!-- Left Glacis Armor Plate (Light Facet) -->
    <polygon points="144,188 256,212 256,388 152,364"
             fill="url(#armorLight)" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>

    <!-- Right Glacis Armor Plate (Shadow Facet) -->
    <polygon points="256,212 368,188 360,364 256,388"
             fill="url(#armorDark)" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>

    <!-- Center Glacis Ridge Bevel Highlight -->
    <line x1="256" y1="212" x2="256" y2="388" stroke="#cbd5e1" stroke-width="2.5"/>

    <!-- Lower Ballistic Prow Wedge -->
    <polygon points="152,364 256,388 360,364 342,408 256,432 170,408"
             fill="#0f172a" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="170,408 256,432 256,388" fill="url(#armorLight)" opacity="0.7"/>
    <polygon points="256,432 342,408 256,388" fill="url(#armorDark)" opacity="0.7"/>

    <!-- Unified Tactical Chevron Insignia on Lower Glacis -->
    <path d="M228 394 L256 412 L284 394 L284 402 L256 420 L228 402 Z"
          fill="url(#goldRim)" stroke="#78350f" stroke-width="1"/>

    <!-- Front Cyber Headlight Recesses (Clean Solid Slits) -->
    <polygon points="152,228 178,228 174,242 148,242"
             fill="#0a0f1d" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="152" y1="235" x2="174" y2="235" stroke="#38bdf8" stroke-width="2.5" filter="url(#cyanGlow)"/>

    <polygon points="360,228 334,228 338,242 364,242"
             fill="#0a0f1d" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="360" y1="235" x2="338" y2="235" stroke="#38bdf8" stroke-width="2.5" filter="url(#cyanGlow)"/>

    <!-- --- 3. HEAVY DUAL-RAIL CANNON ASSEMBLY --- -->
    <!-- Solid Gun Mantlet Collar (Base on Hull) -->
    <polygon points="214,166 298,166 306,192 206,192"
             fill="#0b111e" stroke="#475569" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="220,168 292,168 298,188 214,188"
             fill="url(#armorLight)"/>

    <!-- Left Heavy Barrel / Rail -->
    <rect x="234" y="74" width="18" height="112" rx="3"
          fill="url(#armorLight)" stroke="#1e293b" stroke-width="2"/>
    <!-- Right Heavy Barrel / Rail -->
    <rect x="260" y="74" width="18" height="112" rx="3"
          fill="url(#armorDark)" stroke="#1e293b" stroke-width="2"/>

    <!-- Central Energy Rail Acceleration Channel -->
    <line x1="256" y1="82" x2="256" y2="174" stroke="#0f172a" stroke-width="6"/>
    <line x1="256" y1="84" x2="256" y2="172" stroke="#38bdf8" stroke-width="2.5" filter="url(#cyanGlow)"/>

    <!-- Barrel Reinforcement Rings -->
    <rect x="230" y="104" width="52" height="7" rx="1.5"
          fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="230" y="136" width="52" height="7" rx="1.5"
          fill="#0f172a" stroke="#475569" stroke-width="1.2"/>

    <!-- Monolithic Heavy Muzzle Brake -->
    <polygon points="224,54 288,54 292,80 220,80"
             fill="#090d16" stroke="url(#goldRim)" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="228,58 284,58 288,76 224,76"
             fill="url(#armorLight)"/>
    <!-- Muzzle Dual Ports -->
    <rect x="234" y="52" width="16" height="8" rx="2" fill="#04060a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="262" y="52" width="16" height="8" rx="2" fill="#04060a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="242" cy="56" r="3" fill="#38bdf8" filter="url(#cyanGlow)"/>
    <circle cx="270" cy="56" r="3" fill="#38bdf8" filter="url(#cyanGlow)"/>

    <!-- --- 4. AGGRESSIVE FACETED TURRET & VISOR --- -->
    <!-- Turret Base Shadow Ring -->
    <ellipse cx="256" cy="224" rx="90" ry="34" fill="#060911" stroke="#1e293b" stroke-width="2"/>

    <!-- Left Turret Armor Facet (Light Titanium) -->
    <polygon points="174,212 256,182 256,252 168,258"
             fill="url(#armorLight)" stroke="#64748b" stroke-width="2" stroke-linejoin="round"/>

    <!-- Right Turret Armor Facet (Gunmetal Shadow) -->
    <polygon points="256,182 338,212 344,258 256,252"
             fill="url(#armorDark)" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>

    <!-- Turret Sloped Upper Roof -->
    <polygon points="196,180 316,180 338,212 256,182 174,212"
             fill="#1e293b" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Turret Ridge Bevel Highlight -->
    <line x1="256" y1="182" x2="256" y2="252" stroke="#e2e8f0" stroke-width="2.5"/>

    <!-- Commander Optical Cupola (Left Roof) -->
    <ellipse cx="210" cy="192" rx="14" ry="7" fill="#0b111e" stroke="#f59e0b" stroke-width="1.5"/>
    <ellipse cx="210" cy="192" rx="7" ry="3.5" fill="#38bdf8" filter="url(#cyanGlow)"/>

    <!-- Target Rangefinder Sensor Pod (Right Roof) -->
    <rect x="290" y="194" width="20" height="12" rx="2.5" fill="#0b111e" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="300" cy="200" r="3.5" fill="#f59e0b"/>

    <!-- --- 5. LETHAL "IRON STORM" OPTIC VISOR (UNIFIED GLOW) --- -->
    <!-- Visor Recessed Housing Slot -->
    <polygon points="192,224 256,238 320,224 322,234 256,248 190,234"
             fill="#020617" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Visor Glowing Aperture Strip -->
    <polygon points="196,226 256,239 316,226 314,231 256,244 198,231"
             fill="url(#visorGrad)" filter="url(#cyanGlow)"/>

    <!-- Turret Lower Trim Neon Edge -->
    <path d="M168 258 L256 252 L344 258" fill="none" stroke="url(#goldRim)" stroke-width="2.5"/>
  </g>

  <!-- ==================== TACTICAL BRACKETS (MINIMAL & SHARP) ==================== -->
  <g opacity="0.65">
    <!-- Top HUD Bracket -->
    <path d="M236 28 L256 16 L276 28" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="256" cy="16" r="2.5" fill="#38bdf8"/>

    <!-- Left & Right Aiming Ticks -->
    <line x1="28" y1="256" x2="48" y2="256" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="464" y1="256" x2="484" y2="256" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Bottom Indicator -->
    <path d="M244 488 L256 498 L268 488" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
